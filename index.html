<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>macroinception | Initialization</title>
    <style>
        :root {
            --bg-color: #070709;
            --primary: #00e5ff;
            --text-main: #ffffff;
            --text-muted: #8a8a93;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* The central spark representing the starting point */
        .origin-spark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 4px;
            height: 4px;
            background-color: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 30px 15px rgba(0, 229, 255, 0.15);
            z-index: 1;
            transition: all 1.8s cubic-bezier(0.8, 0, 0.2, 1);
        }

        .pulse {
            animation: breathe 4s infinite alternate ease-in-out;
        }

        @keyframes breathe {
            0% { box-shadow: 0 0 20px 10px rgba(0, 229, 255, 0.1); transform: translate(-50%, -50%) scale(1); }
            100% { box-shadow: 0 0 50px 25px rgba(0, 229, 255, 0.3); transform: translate(-50%, -50%) scale(1.5); }
        }

        .content-layer {
            z-index: 10;
            text-align: center;
            transition: opacity 1s ease, transform 1s ease;
        }

        h1 {
            font-size: 4.5rem;
            font-weight: 800;
            letter-spacing: -2px;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #ffffff 0%, #666666 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 3.5rem;
            max-width: 500px;
            line-height: 1.6;
            letter-spacing: 0.5px;
        }

        .start-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-main);
            padding: 1rem 3rem;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
            backdrop-filter: blur(5px);
        }

        .start-btn:hover {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
            background-color: rgba(0, 229, 255, 0.05);
            transform: translateY(-2px);
        }

        .start-btn:active {
            transform: translateY(1px);
        }

        /* --- Animation States Triggered by JS --- */
        
        .ignite .origin-spark {
            width: 250vw;
            height: 250vh;
            background-color: #ffffff;
            box-shadow: none;
        }

        .ignite .content-layer {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
        }

        .new-beginning {
            position: absolute;
            z-index: 100;
            color: #070709;
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease;
        }

        .new-beginning.show {
            opacity: 1;
            transform: translateY(0);
        }

    </style>
</head>
<body>

    <!-- The physical representation of 'starting' -->
    <div class="origin-spark pulse" id="sparkCore"></div>

    <div class="content-layer" id="uiContainer">
        <h1>macroinception</h1>
        <p>Every expansive system originates from a single, concentrated point. The environment is calibrated. Awaiting the spark.</p>
        <button class="start-btn" id="startBtn">Initiate Sequence</button>
    </div>

    <!-- The state that appears after 'starting' -->
    <div class="new-beginning" id="newState">
        <h2 style="font-size: 3rem; margin-bottom: 0.5rem; letter-spacing: -1px;">Day One</h2>
        <p style="font-size: 1.2rem; color: #555;">The architecture is now active.</p>
    </div>

    <script>
        document.getElementById('startBtn').addEventListener('click', function() {
            const body = document.body;
            const spark = document.getElementById('sparkCore');
            const newState = document.getElementById('newState');
            
            // 1. Remove the idle pulse animation
            spark.classList.remove('pulse');
            
            // 2. Trigger the massive expansion (the "inception" moment)
            body.classList.add('ignite');

            // 3. Fade in the new environment after the whiteout completes
            setTimeout(() => {
                body.style.backgroundColor = "#ffffff"; // Lock the background to white
                spark.style.display = "none"; // Hide the overgrown spark
                newState.classList.add('show'); // Reveal the new beginning text
            }, 1500);
        });
    </script>
</body>
</html>
